<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score bug</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/camera.css">
<style>
  /* Centred with left, not a transform: the entry animation owns transform. */
  .bug { position: absolute; left: 370px; top: 28px; width: 1180px; }
  .bug.bottom { top: auto; bottom: 28px; }
  .bug .strip { height: 10px; background: var(--y-pale); margin-bottom: 8px; }
  .bug .scorebar { height: 76px; }
  .bug .scorebar .team { font-size: 32px; }
  .bug .scorebar .num { height: 60px; width: 72px; font-size: 46px; }
</style>
</head>
<body>
<!-- Fully transparent overlay: just the score bar, to lay over any footage.
     ?pos=bottom moves it to the bottom of the picture. -->
<div class="stage hollow">
  <div class="bug rise" id="bug"><div class="strip"></div><div class="scorebar" id="scorebar"></div></div>
</div>
<script type="module">
import { store } from "../shared/store.js";
import { initStage, params, paint } from "../shared/ui.js";
import { scoreBar } from "../shared/camera.js";

initStage();
if (params.get("pos") === "bottom") document.querySelector("#bug").classList.add("bottom");
store.subscribe((state) => paint("#scorebar", scoreBar(state)));
</script>
</body>
</html>
