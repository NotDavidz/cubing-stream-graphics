<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera frame (single)</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/camera.css">
</head>
<body>
<!-- Hollow frame. Put it ABOVE a camera source in OBS, or over footage in an editor.
     It follows the camera chosen in the control panel (Live > One camera).
     ?slot=a or ?slot=b pins it to one camera instead. -->
<div class="stage hollow">
  <div class="cam" id="cam" style="inset:0">
    <div class="edge"></div>
    <div class="plate" id="plate"></div>
    <div id="burst"></div>
    <div class="bulge" id="bulge"></div>
  </div>
</div>
<script type="module">
import { store } from "../shared/store.js";
import { matchInfo } from "../shared/match.js";
import { initStage, params, paint, esc, puzzle, puzzleName, shortName } from "../shared/ui.js";
import { camInfo, camClass, burst } from "../shared/camera.js";

initStage();

store.subscribe((state) => {
  const slot = (params.get("slot") || state.program?.camSlot) === "b" ? "b" : "a";
  const { cam, who } = camInfo(state, slot);
  const m = matchInfo(state), e = state.event || {};
  const short = (x) => esc(shortName(x));
  const score = m.showScore;

  document.querySelector("#cam").className = camClass(state, slot);
  paint("#plate", `
    <div class="nm"><span>${esc(who.name)}</span>${who.team ? `<small>${esc(who.team)}</small>` : ""}</div>
    ${cam.time ? `<div class="time" data-k="time" data-v="${esc(cam.time)}">${esc(cam.time)}</div>` : ""}`);
  paint("#burst", burst(state, slot));
  paint("#bulge", `
    ${score ? `<span>${short(m.a)}</span><span class="num a" data-k="a" data-v="${m.scoreA}">${m.scoreA}</span><span class="sep"></span>` : ""}
    ${puzzle(e.puzzle, 40)}<span class="what" data-fit="line">${esc([puzzleName(e.puzzle, true), e.round].filter(Boolean).join(" · "))}</span>
    ${score ? `<span class="sep"></span><span class="num b" data-k="b" data-v="${m.scoreB}">${m.scoreB}</span><span>${short(m.b)}</span>` : ""}`);
});
</script>
</body>
</html>
