<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Competitor overview</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  main { display: grid; grid-template-columns: 400px 1fr; gap: 22px; }

  .card { padding: 26px; display: flex; flex-direction: column; gap: 18px; }
  .card .avatar { width: 100% !important; font-size: 130px !important; }
  .facts { display: flex; flex-direction: column; gap: 8px; }
  .fact { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; background: var(--panel-2); padding: 8px 14px; }
  .fact b { font-size: 24px; font-weight: 700; white-space: nowrap; }

  .info { padding: 30px 34px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .name { font-size: 76px; font-weight: 800; line-height: 1; text-transform: uppercase; color: var(--y-gold); }
  .bio { font-size: 26px; font-weight: 500; }

  .events { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-content: start; flex: 1; }
  .event { background: var(--panel-2); padding: 20px; display: flex; gap: 22px; align-items: center; }
  .event .puzzle { width: 104px !important; height: 104px !important; flex: none; }
  .event h3 { font-size: 28px; font-weight: 800; text-transform: uppercase; color: var(--y-gold); white-space: nowrap; }
  .event .times { display: flex; gap: 22px; margin-top: 4px; }
  .event .times span { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .event .times b { display: block; font-size: 30px; font-weight: 800; color: var(--white); letter-spacing: 0; }
  .event.main { outline: 4px solid var(--y-gold); outline-offset: -4px; }
</style>
</head>
<body>
<div class="stage solid">
  <header class="banner"></header>
  <main></main>
  <footer class="infobar"></footer>
</div>
<script type="module">
import { store } from "../shared/store.js";
import { initStage, params, paint, esc, entity, avatar, puzzle, banner, eventInfobar, puzzleName } from "../shared/ui.js";

initStage();

// Shows ?id=c1 if given, otherwise whoever the operator selected.
store.subscribe((state) => {
  const id = params.get("id") || state.program?.competitor;
  const p = state.competitors?.[id];
  paint(".banner", banner("Competitor"));
  paint(".infobar", eventInfobar(state));
  if (!p) return paint("main", "");

  const e = entity(state, id);
  const facts = [["WCA ID", p.wcaId], ["Team", e.team], ["Program", p.program]]
    .filter(([, v]) => v)
    .map(([k, v]) => `<div class="fact"><span class="label">${esc(k)}</span><b>${esc(v)}</b></div>`).join("");
  const events = Object.entries(p.events || {}).map(([ev, t]) => `
    <div class="event ${ev === p.mainEvent ? "main" : ""}">
      ${puzzle(ev, 84)}
      <div><h3>${esc(puzzleName(ev, true))}</h3>
        <div class="times">
          <span>Single<b>${esc(t.single || "–")}</b></span>
          <span>Average<b>${esc(t.average || "–")}</b></span>
        </div></div>
    </div>`).join("");

  paint("main", `
    <section class="card panel rise">${avatar(e, 348)}<div class="facts">${facts}</div></section>
    <section class="info panel rise" style="animation-delay:.08s">
      <div class="name">${esc(p.name)}</div>
      ${p.bio ? `<div class="bio">${esc(p.bio)}</div>` : ""}
      <div class="label">Personal bests</div>
      <div class="events">${events}</div>
    </section>`);
});
</script>
</body>
</html>
