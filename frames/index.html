<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UW Cubing frames</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  html, body { overflow: auto; height: auto; background: var(--ink); }
  body { padding: 30px; max-width: 900px; margin: 0 auto; }
  h1 { color: var(--y-gold); text-transform: uppercase; font-weight: 800; margin-bottom: 6px; }
  h2 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 26px 0 8px; }
  a { display: block; background: var(--panel); color: var(--white); text-decoration: none; padding: 12px 16px; margin-bottom: 6px; font-weight: 600; }
  a:hover { outline: 2px solid var(--y-gold); }
  a span { color: var(--muted); font-weight: 400; margin-left: 10px; }
  p a { display: inline; background: none; padding: 0; color: var(--y-gold); }
</style>
</head>
<body>
<h1>Frames</h1>
<p>Change what they show from the <a href="../control/">control panel</a>.</p>
<h2>Switched by the operator</h2>
<a href="program.html">Program <span>one source that shows whichever page is chosen in the control panel</span></a>
<h2>Solid (shown on their own)</h2>
<div id="solid"></div>
<h2>Hollow (go over camera footage)</h2>
<div id="hollow"></div>
<script type="module">
// The list is built from shared/scenes.js, so a new frame shows up by itself.
import { SCENES } from "../shared/scenes.js";

const link = (href, name, note = "") => `<a href="${href}">${name}${note ? ` <span>${note}</span>` : ""}</a>`;
for (const kind of ["solid", "hollow"]) {
  document.querySelector(`#${kind}`).innerHTML = SCENES.filter((s) => s.kind === kind).map((s) =>
    link(`${s.id}.html`, s.name, s.note) + (s.variants || []).map(([query, name]) => link(`${s.id}.html${query}`, name)).join("")).join("");
}
</script>
</body>
</html>
