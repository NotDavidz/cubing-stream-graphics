<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera frame (single)</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/camera.css">
</head>
<body>
<!-- Hollow frame. Put it ABOVE a camera source in OBS, or over footage in an editor.
     ?slot=a or ?slot=b chooses which camera's competitor and status it follows. -->
<div class="stage hollow">
  <div class="cam" id="cam" style="inset:0">
    <div class="edge"></div>
    <div class="plate" id="plate"></div>
    <div id="burst"></div>
    <div class="bulge" id="bulge"></div>
  </div>
</div>
<script type="module">
import { store } from "../shared/store.js";
import { initStage, params, paint, esc, entity, puzzle, puzzleName } from "../shared/ui.js";
import { camInfo, camClass, burst } from "../shared/camera.js";

initStage();
const slot = params.get("slot") === "b" ? "b" : "a";

store.subscribe((state) => {
  const { cam, who } = camInfo(state, slot);
  const m = state.match || {}, e = state.event || {};
  const a = entity(state, m.a), b = entity(state, m.b);
  const short = (x) => esc(x.tag || x.name);
  const score = m.show !== false;

  document.querySelector("#cam").className = camClass(state, slot);
  paint("#plate", `
    <div class="nm">${esc(who.name)}${who.team ? `<small>${esc(who.team)}</small>` : ""}</div>
    ${cam.time ? `<div class="time pop">${esc(cam.time)}</div>` : ""}`);
  paint("#burst", burst(state, slot));
  paint("#bulge", `
    ${score ? `<span>${short(a)}</span><span class="num a">${esc(m.scoreA ?? 0)}</span><span class="sep"></span>` : ""}
    ${puzzle(e.puzzle, 40)}<span>${esc([puzzleName(e.puzzle, true), e.round].filter(Boolean).join(" · "))}</span>
    ${score ? `<span class="sep"></span><span class="num b">${esc(m.scoreB ?? 0)}</span><span>${short(b)}</span>` : ""}`);
});
</script>
</body>
</html>
