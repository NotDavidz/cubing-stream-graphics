<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event champion</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  main { display: flex; flex-direction: column; gap: 22px; }

  .hero { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 50px; padding: 0 60px;
          outline: 6px solid var(--y-gold); outline-offset: -6px; position: relative; overflow: hidden; }
  .hero .avatar { animation: pop .5s .15s ease-out both; }
  .hero .text { min-width: 0; display: flex; flex-direction: column; gap: 14px; position: relative; }
  .hero .tag { align-self: flex-start; font-size: 26px; padding: 5px 18px; background: var(--y-bright); animation: wipe .4s .2s ease-out both; }
  .hero .name { font-size: 124px; font-weight: 800; line-height: 1; text-transform: uppercase; color: var(--y-gold); animation: wipe .6s .3s ease-out both; }
  .hero .note { font-size: 30px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .hero .empty { grid-column: 1 / -1; text-align: center; font-size: 30px; }

  /* Final score, and who they beat. */
  .result { display: flex; align-items: center; gap: 22px; animation: rise .45s .55s ease-out both; }
  .result .nums { display: flex; align-items: center; gap: 12px; font-size: 76px; font-weight: 800; line-height: 1; }
  .result .nums b { background: var(--y-gold); color: var(--ink); min-width: 96px; padding: 6px 14px; text-align: center; }
  .result .nums i { font-style: normal; background: var(--panel-2); color: var(--white); min-width: 96px; padding: 6px 14px; text-align: center; }
  .result .beat { min-width: 0; font-size: 34px; font-weight: 800; text-transform: uppercase; }
  .result .beat .label { display: block; }

  /* The members of a winning team: photo and name, nothing else. */
  .roster { flex: none; height: 150px; display: flex; gap: 16px; }
  .roster:empty { display: none; }
  .chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 20px; padding: 0 24px; }
  .chip h3 { flex: 1; min-width: 0; font-size: 30px; font-weight: 800; line-height: 1.1; text-transform: uppercase; color: var(--y-gold); }

  .hero > .avatar { position: relative; }      /* above the confetti */
</style>
</head>
<body>
<div class="stage solid">
  <header class="banner"></header>
  <main>
    <section class="hero panel" id="hero"></section>
    <section class="roster" id="roster"></section>
  </main>
  <footer class="infobar"></footer>
</div>
<script type="module">
import { store } from "../shared/store.js";
import { victoryInfo } from "../shared/match.js";
import { initStage, paint, esc, avatar, banner, eventInfobar, puzzleName, confetti } from "../shared/ui.js";

// The winner of the whole event. (Winning a single match is celebrated on
// the Versus page instead.)
initStage();

// A winning team lists its members. A single winner needs nothing more: the
// page is theirs.
function roster(w) {
  return w.members.map((m, i) => `<div class="chip panel rise" style="animation-delay:${0.6 + i * 0.08}s">
      ${avatar(m, 100)}<h3 data-fit="wrap">${esc(m.name)}</h3></div>`).join("");
}

store.subscribe((state) => {
  const v = state.victory || {};
  const { winner, loser, score } = victoryInfo(state);
  const e = state.event || {};
  const plural = winner?.kind === "team";
  paint(".banner", banner(v.title || (plural ? "Champions" : "Champion"), [e.subtitle, puzzleName(e.puzzle)].filter(Boolean).join(" · ")));
  paint(".infobar", eventInfobar(state));
  if (!winner) {
    paint("#hero", `<div class="empty label">The champion appears here once one is chosen</div>`);
    return paint("#roster", "");
  }
  paint("#hero", `
    ${confetti()}
    ${avatar(winner, 330)}
    <div class="text">
      <span class="tag">${esc(e.title || "Event")} ${plural ? "champions" : "champion"}</span>
      <div class="name" data-fit="line">${esc(winner.name)}</div>
      ${v.note ? `<div class="note" data-fit="line">${esc(v.note)}</div>` : ""}
      ${score ? `<div class="result">
          <div class="nums"><b>${score[0]}</b><i>${score[1]}</i></div>
          <div class="beat"><span class="label">Defeated in the final</span><span data-fit="line">${esc(loser.name)}</span></div>
        </div>` : ""}
    </div>`);
  paint("#roster", roster(winner));
});
</script>
</body>
</html>
